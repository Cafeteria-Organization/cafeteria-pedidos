<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Cafetería Univalle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css?v=20260930b">
</head>
<body>

<header id="cabecera"></header>

<main class="acceso">
  <div class="hero-arte" id="hero-arte" aria-hidden="true"></div>

  <div class="contenedor hero-contenido">
    <p class="eyebrow">Bienvenido</p>
    <h1 class="hero-titulo">Tu café, listo cuando llegas</h1>

    <section class="acceso-card">
      <div class="pestanas" role="tablist">
        <button type="button" class="pestana activa" role="tab" id="tab-ingresar" aria-selected="true" data-panel="ingresar">Ingresar</button>
        <button type="button" class="pestana" role="tab" id="tab-registro" aria-selected="false" data-panel="registro">Crear cuenta</button>
      </div>

      <div id="panel" class="panel-fade">
        <!-- Ingresar (POST /api/login) -->
        <div data-vista="ingresar">
          <h2 class="form-titulo">Bienvenido de vuelta</h2>
          <p class="form-subtitulo">Ingresa con tu correo institucional para hacer tu pedido.</p>

          <form class="formulario" id="form-ingresar" novalidate>
            <div class="mensaje" id="msg-ingresar" hidden></div>
            <div class="campo">
              <label for="correo">Correo</label>
              <input type="email" id="correo" name="correo" placeholder="tu.nombre@univalle.edu" autocomplete="username" required>
            </div>
            <div class="campo">
              <label for="password">Contraseña</label>
              <div class="password-wrap">
                <input type="password" id="password" name="password" placeholder="••••••" autocomplete="current-password" required>
                <button type="button" class="toggle-pass" data-objetivo="password">Mostrar</button>
              </div>
            </div>
            <button type="submit" class="btn btn-oscuro btn-bloque">Ingresar</button>
          </form>
        </div>

        <!-- Crear cuenta (POST /api/register) -->
        <div data-vista="registro" hidden>
          <h2 class="form-titulo">Crea tu cuenta</h2>
          <p class="form-subtitulo">Solo para estudiantes y docentes con correo <strong>@univalle.edu</strong> o <strong>@est.univalle.edu</strong>.</p>

          <form class="formulario" id="form-registro" novalidate>
            <div class="mensaje" id="msg-registro" hidden></div>
            <div class="campo">
              <label for="reg-nombre">Nombre completo</label>
              <input type="text" id="reg-nombre" name="nombre" placeholder="Ej.: Amara Quintela" autocomplete="name" maxlength="100" required>
            </div>
            <div class="campo">
              <label for="reg-correo">Correo institucional</label>
              <input type="email" id="reg-correo" name="correo" placeholder="tu.nombre@est.univalle.edu" autocomplete="email" maxlength="100" required>
            </div>
            <div class="campo">
              <label for="reg-password">Contraseña</label>
              <div class="password-wrap">
                <input type="password" id="reg-password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                <button type="button" class="toggle-pass" data-objetivo="reg-password">Mostrar</button>
              </div>
            </div>
            <div class="campo">
              <label for="reg-password2">Repite la contraseña</label>
              <input type="password" id="reg-password2" name="password2" placeholder="••••••" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-oscuro btn-bloque">Crear cuenta</button>
          </form>
        </div>
      </div>
    </section>
  </div>
</main>

<footer id="pie"></footer>

<script src="../assets/js/config.js?v=20260930b"></script>
<script src="../assets/js/api.js?v=20260930b"></script>
<script src="../assets/js/arte.js?v=20260930b"></script>
<script src="../assets/js/ui.js?v=20260930b"></script>
<script src="../assets/js/ingresar.js?v=20260930b"></script>
</body>
</html>
