<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar · Cafetería Univalle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css?v=20261122">
</head>
<body>

<header id="cabecera"></header>

<main class="acceso">
  <div class="acceso-fondo" aria-hidden="true"></div>

  <!-- Fotos del menú repartidas a los costados -->
  <div class="acceso-figuras" aria-hidden="true">
    <img class="figura f1" src="../assets/img/decoracion/capuchino.jpg" alt="">
    <img class="figura f2" src="../assets/img/decoracion/waffles.jpg" alt="">
    <img class="figura f3 redonda" src="../assets/img/decoracion/jugo-natural.jpg" alt="">
    <img class="figura f4" src="../assets/img/decoracion/hamburguesa.jpg" alt="">
    <img class="figura f5" src="../assets/img/decoracion/brownie-helado.jpg" alt="">
    <img class="figura f6 redonda" src="../assets/img/decoracion/cesar.jpg" alt="">
  </div>

  <div class="acceso-marco">
  <div class="acceso-tarjeta">
    <!-- Lado de la foto -->
    <aside class="acceso-foto">
      <div class="acceso-foto-texto">
        <p class="eyebrow">Cafetería Univalle</p>
        <h1>Tu café, listo cuando llegas</h1>
        <ul class="acceso-ventajas">
          <li><span data-icono="recibo"></span>Pide desde el aula</li>
          <li><span data-icono="qr"></span>Recoge con tu código</li>
          <li><span data-icono="reloj"></span>Sin filas en el receso</li>
        </ul>
      </div>
    </aside>

    <!-- Un solo ingreso para estudiantes, docentes y personal: el servidor sabe qué cuenta es -->
    <section class="acceso-formulario">
      <p class="eyebrow eyebrow-oscuro">Bienvenido</p>
      <h2 class="form-titulo">Ingresa a tu cuenta</h2>
      <p class="form-subtitulo">Usa el correo y la contraseña que te dio la universidad.</p>

      <form class="formulario" id="form-ingresar" novalidate>
        <div class="mensaje" id="msg-ingresar" hidden></div>
        <div class="campo">
          <label for="correo">Correo</label>
          <div class="campo-icono">
            <span data-icono="correo"></span>
            <input type="email" id="correo" name="correo" placeholder="tu.nombre@univalle.edu" autocomplete="username" required>
          </div>
          <span class="tipo-cuenta" id="tipo-cuenta" hidden></span>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="campo-icono">
            <span data-icono="candado"></span>
            <input type="password" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" required>
            <button type="button" class="ver-clave" id="ver-password" aria-label="Mostrar contraseña" data-icono="ojo"></button>
          </div>
        </div>
        <button type="submit" class="btn btn-oscuro btn-bloque btn-lg">Ingresar</button>
      </form>

    </section>
  </div>
  </div>
</main>

<footer id="pie"></footer>

<script src="../assets/js/config.js?v=20261122"></script>
<script src="../assets/js/api.js?v=20261122"></script>
<script src="../assets/js/iconos-galeria.js?v=20261122"></script>
<script src="../assets/js/iconos.js?v=20261122"></script>
<script src="../assets/js/ui.js?v=20261122"></script>
<script src="../assets/js/ingresar.js?v=20261122"></script>
</body>
</html>
